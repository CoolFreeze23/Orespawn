plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.21'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    // GeckoLib — required for the Queen's Blockbench-driven animation pipeline
    // (see QueenModel / QueenRenderer / TheQueen.registerControllers).
    // GeckoLib publishes its NeoForge 1.21.x artifacts to Cloudsmith;
    // BlameJared no longer hosts them. Both releases and snapshots
    // resolve from the same dl.cloudsmith.io URL.
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    // Commoble — supplies Databuddy, a codec/registry helper used by the
    // vendored MultiHitBoxLib's MHLibHitboxTypes.HITBOX_TYPE_DISPATCHER
    // (RegistryDispatcher.makeDispatchForgeRegistry). Real runtime dep
    // since MHLibHitboxTypes builds the dispatcher eagerly at class-init.
    maven {
        name = 'Commoble'
        url = 'https://commoble.net/maven/'
    }
}

// ──────────────────────────────────────────────────────────────────────
// Access transformers
//
// Vendored MultiHitBoxLib needs Entity#ENTITY_COUNTER widened from
// `protected` to `public` so its IMultipartEntity helper can reserve a
// contiguous block of entity IDs for parent + part-entities. The widening
// lives in src/main/resources/META-INF/accesstransformer.cfg (vendored
// from upstream verbatim — same Mojang-mapped name in 1.21.1).
//
// NeoGradle 7.1.21 supports auto-discovery of this exact path but proved
// unreliable in CI here, so we register it explicitly to be safe.
// ──────────────────────────────────────────────────────────────────────
minecraft {
    accessTransformers {
        file project.file('src/main/resources/META-INF/accesstransformer.cfg')
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// GameTest suite (2026-08-10): lives in its own source set so test code and
// test templates never ship in the mod jar. Wired into the gameTestServer
// run (headless, CI-able — exits nonzero on failure) and the client run
// (/test commands in dev).
sourceSets {
    gametest {
        // Convention already maps src/gametest/java + src/gametest/resources.
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    // Phase G1 conversion/parity tooling. This executes the compiled client
    // model classes but never ships in the mod jar.
    g1tool {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
    g1toolImplementation.extendsFrom implementation
    g1toolRuntimeOnly.extendsFrom runtimeOnly
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        modSource project.sourceSets.gametest
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        modSource project.sourceSets.gametest
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// Static asset/renderer completeness audit (2026-08-11, manual-session
// replacement): fails the build on missing models/textures/blockstates,
// unrendered entities, or dangling GUI/sound refs. Documented-faithful
// exceptions live in the script's ACKNOWLEDGED set.
tasks.register('assetAudit', Exec) {
    group = 'verification'
    description = 'Run tools/asset_audit.py (exit 1 on ERROR findings).'
    workingDir = projectDir
    commandLine 'python', 'tools/asset_audit.py'
}
tasks.named('build') { dependsOn 'assetAudit' }

// Phase G1 harness: execute each createBodyLayer() from compiled bytecode,
// convert the resulting definition tree, bake the generated geo through the
// pinned GeckoLib 4.8.4 implementation, and compare geometry/animation/pixels
// through independent formulations. Checked-in proof evidence is immutable;
// the task regenerates into build/g1 and byte-compares it with that evidence.
def g1Manifest = file('tools/g1_model_proofs.json')
def g1BenchmarkProtocol = file('tools/g1_performance_benchmark.json')
def g1BuildDir = layout.buildDirectory.dir('g1')
def g1RuntimeClasspathFile = g1BuildDir.map { it.file('runtime-classpath.txt') }
def g1RuntimeClasspath = sourceSets.g1tool.runtimeClasspath

tasks.register('g1WriteRuntimeClasspath') {
    group = 'verification'
    description = 'Record the exact G1 runtime classpath for independent benchmark provenance checks.'
    dependsOn tasks.named('g1toolClasses')
    outputs.file(g1RuntimeClasspathFile)
    outputs.upToDateWhen { false }
    doLast {
        def output = g1RuntimeClasspathFile.get().asFile
        output.parentFile.mkdirs()
        output.setText(g1RuntimeClasspath.files
                .collect { it.absolutePath }.join('\n') + '\n', 'UTF-8')
    }
}

tasks.register('g1DumpCompiledModels', JavaExec) {
    group = 'verification'
    description = 'Dump compiled/baked LayerDefinition trees for the G1 proof models.'
    dependsOn tasks.named('g1toolClasses')
    classpath = sourceSets.g1tool.runtimeClasspath
    mainClass = 'danger.orespawn.g1.G1ModelProbe'
    args 'vanilla', g1Manifest.absolutePath,
            g1BuildDir.get().dir('vanilla').asFile.absolutePath
}

tasks.register('g1ConvertModels', Exec) {
    group = 'verification'
    description = 'Convert compiled G1 dumps to Bedrock geo plus explicitly reference-only animation artifacts.'
    dependsOn tasks.named('g1DumpCompiledModels')
    workingDir = projectDir
    commandLine 'python', 'tools/layer_definition_to_geo.py',
            '--manifest', g1Manifest.absolutePath,
            '--dump-dir', g1BuildDir.get().dir('vanilla').asFile.absolutePath,
            '--output-dir', g1BuildDir.get().dir('generated').asFile.absolutePath
}

tasks.register('g1ProbeGeoRenderer', JavaExec) {
    group = 'verification'
    description = 'Bake and capture generated geometry through GeckoLib GeoRenderer.'
    dependsOn tasks.named('g1ConvertModels')
    classpath = sourceSets.g1tool.runtimeClasspath
    mainClass = 'danger.orespawn.g1.G1ModelProbe'
    args 'geo', g1Manifest.absolutePath,
            g1BuildDir.get().dir('generated').asFile.absolutePath,
            g1BuildDir.get().dir('geo').asFile.absolutePath
}

tasks.register('g1Benchmark', JavaExec) {
    group = 'verification'
    description = 'Run the non-acceptance G1 SMOKE_ONLY / COMPONENT_PROXY_ONLY / PENDING_LIVE_PRECUTOVER benchmark.'
    dependsOn tasks.named('g1ConvertModels')
    classpath = sourceSets.g1tool.runtimeClasspath
    mainClass = 'danger.orespawn.g1.G1PerformanceBenchmark'
    args g1Manifest.absolutePath,
            g1BuildDir.get().dir('generated').asFile.absolutePath,
            g1BuildDir.get().dir('vanilla').asFile.absolutePath,
            g1BenchmarkProtocol.absolutePath,
            'smoke',
            projectDir.absolutePath,
            g1BuildDir.get().dir('benchmark').file('report.json').asFile.absolutePath
}

tasks.register('g1BenchmarkVerify', Exec) {
    group = 'verification'
    description = 'Validate checked-in component-smoke evidence without making a Q6 pass claim.'
    dependsOn tasks.named('g1ConvertModels')
    dependsOn tasks.named('g1WriteRuntimeClasspath')
    workingDir = projectDir
    commandLine 'python', 'tools/g1_benchmark_gate.py',
            '--protocol', g1BenchmarkProtocol.absolutePath,
            '--manifest', g1Manifest.absolutePath,
            '--report', file('phase_g_reports/g1_proof/benchmark/report.json').absolutePath,
            '--proof-dir', file('phase_g_reports/g1_proof').absolutePath,
            '--repository-root', projectDir.absolutePath,
            '--generated-dir', g1BuildDir.get().dir('generated').asFile.absolutePath,
            '--compiled-dir', g1BuildDir.get().dir('vanilla').asFile.absolutePath,
            '--runtime-classpath-file', g1RuntimeClasspathFile.get().asFile.absolutePath
}

tasks.register('g1Parity', Exec) {
    group = 'verification'
    description = 'Run independent G1 geometry, animation, and visual parity gates.'
    dependsOn tasks.named('g1ProbeGeoRenderer')
    workingDir = projectDir
    commandLine 'python', 'tools/g1_render_parity.py',
            '--manifest', g1Manifest.absolutePath,
            '--vanilla-dir', g1BuildDir.get().dir('vanilla').asFile.absolutePath,
            '--generated-dir', g1BuildDir.get().dir('generated').asFile.absolutePath,
            '--geo-dir', g1BuildDir.get().dir('geo').asFile.absolutePath,
            '--output-dir', g1BuildDir.get().dir('evidence').asFile.absolutePath,
            '--proof-dir', file('phase_g_reports/g1_proof').absolutePath
}
tasks.named('check') {
    dependsOn tasks.named('g1Parity')
    dependsOn tasks.named('g1BenchmarkVerify')
}

// Phase G Slice 4: the same probe/converter/parity tools over a second
// manifest and proof directory, so Tier-3 rigs are proven without touching
// the immutable G1 evidence. Separate build dir: both tools prune their
// output dir to the current manifest's ids.
def s4Manifest = file('tools/s4_model_proofs.json')
def s4BuildDir = layout.buildDirectory.dir('s4')

tasks.register('s4DumpCompiledModels', JavaExec) {
    group = 'verification'
    description = 'Dump compiled/baked LayerDefinition trees for the Slice 4 models.'
    dependsOn tasks.named('g1toolClasses')
    classpath = sourceSets.g1tool.runtimeClasspath
    mainClass = 'danger.orespawn.g1.G1ModelProbe'
    args 'vanilla', s4Manifest.absolutePath,
            s4BuildDir.get().dir('vanilla').asFile.absolutePath
}

tasks.register('s4ConvertModels', Exec) {
    group = 'verification'
    description = 'Convert compiled Slice 4 dumps to Bedrock geo.'
    dependsOn tasks.named('s4DumpCompiledModels')
    workingDir = projectDir
    commandLine 'python', 'tools/layer_definition_to_geo.py',
            '--manifest', s4Manifest.absolutePath,
            '--dump-dir', s4BuildDir.get().dir('vanilla').asFile.absolutePath,
            '--output-dir', s4BuildDir.get().dir('generated').asFile.absolutePath
}

tasks.register('s4ProbeGeoRenderer', JavaExec) {
    group = 'verification'
    description = 'Bake and capture Slice 4 geometry through GeckoLib GeoRenderer.'
    dependsOn tasks.named('s4ConvertModels')
    classpath = sourceSets.g1tool.runtimeClasspath
    mainClass = 'danger.orespawn.g1.G1ModelProbe'
    args 'geo', s4Manifest.absolutePath,
            s4BuildDir.get().dir('generated').asFile.absolutePath,
            s4BuildDir.get().dir('geo').asFile.absolutePath
}

tasks.register('s4Parity', Exec) {
    group = 'verification'
    description = 'Run the geometry, animation and visual parity gates over the Slice 4 models.'
    dependsOn tasks.named('s4ProbeGeoRenderer')
    workingDir = projectDir
    commandLine 'python', 'tools/g1_render_parity.py',
            '--manifest', s4Manifest.absolutePath,
            '--vanilla-dir', s4BuildDir.get().dir('vanilla').asFile.absolutePath,
            '--generated-dir', s4BuildDir.get().dir('generated').asFile.absolutePath,
            '--geo-dir', s4BuildDir.get().dir('geo').asFile.absolutePath,
            '--output-dir', s4BuildDir.get().dir('evidence').asFile.absolutePath,
            '--proof-dir', file('phase_g_reports/s4_proof').absolutePath
}
tasks.named('check') { dependsOn tasks.named('s4Parity') }

// BUG-032 (beta.3): the DISTRIBUTED jar must be the jarJar output (nested
// databuddy under META-INF/jarjar). Swap classifiers so the unclassified
// `orespawn-<version>.jar` — the file everyone downloads — is the combined
// one, and the library-less variant is clearly labeled `-slim`. jarJar is
// wired into `build` so no release can be cut without the nested deps.
tasks.named('jar', Jar) { archiveClassifier = 'slim' }
tasks.named('jarJar') { archiveClassifier = '' }
tasks.named('build') { dependsOn 'jarJar' }

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    // GeckoLib 4.x for NeoForge 1.21.1 — powers the Queen Geckolib backend
    // (8-stage state machine, dynamic blue/red texture phase swap) AND
    // MultiHitBoxLib's geckolib bone-tracking integration (mixin/geckolib/*,
    // BoneTrackingGeoEntityRenderer).
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    // Databuddy — used at *runtime* by MHLibHitboxTypes (it constructs a
    // RegistryDispatcher at class-init time), so this is a real
    // implementation dep, not compileOnly. The 1.21 artifact resolves
    // fine on 1.21.1 because Databuddy targets Mojang-mapped APIs that
    // didn't change between 1.21 and 1.21.1.
    //
    // NOTE: AzureLib is NOT a dependency. The vendored MHLib in this
    // project has had every AzureLib-touching class deleted (mixin/azurelib,
    // client/azurelib, assetsynch/impl/Alib*, api/alibplus, example
    // AnjanathALib) so its class graph never references mod.azure.* —
    // which would otherwise crash with NoClassDefFoundError at runtime.
    implementation "net.commoble.databuddy:databuddy-1.21:6.0.0.0"
    // BUG-032 (beta.3): databuddy must SHIP inside the jar — implementation
    // alone only put it on the dev/gametest classpath, so the published
    // beta.2 jar crashed any instance without databuddy installed
    // (NoClassDefFoundError from MHLibHitboxTypes.<clinit>). jarJar nests it
    // under META-INF/jarjar/ and NeoForge loads it as the GAMELIBRARY its
    // manifest declares. Version range pins the 6.0.x line.
    jarJar("net.commoble.databuddy:databuddy-1.21:[6.0.0.0,6.1.0)")
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_credits            : mod_credits,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ──────────────────────────────────────────────────────────────────────
// deployToPrism — builds the mod JAR and copies it into a Prism Launcher
// instance's mods/ folder so the user can play through Prism rather than
// gradlew runClient. The destination path is read from the
// `prism_mods_dir` property in gradle.properties so the task stays
// portable across machines / instances. Any pre-existing orespawn-*.jar
// in the destination is deleted first to avoid NeoForge's duplicate-mod
// error on launch.
// ──────────────────────────────────────────────────────────────────────
// Capture project-scoped properties at configuration time so the Copy
// task's nested closures (which run with the Task as their delegate)
// can still see them.
def deployModId = project.mod_id
def deployModVersion = project.mod_version
def deployPrismDir = project.findProperty('prism_mods_dir')

tasks.register('deployToPrism', Copy) {
    group = 'orespawn'
    description = 'Build the mod JAR and copy it into the Prism Launcher mods folder.'
    dependsOn tasks.named('build')

    if (deployPrismDir == null) {
        throw new GradleException(
            "deployToPrism requires the 'prism_mods_dir' property. " +
            "Add it to gradle.properties, e.g.:\n" +
            "  prism_mods_dir=C:/Users/<you>/AppData/Roaming/PrismLauncher/instances/<instance>/minecraft/mods"
        )
    }

    def prismModsDir = file(deployPrismDir)

    doFirst {
        if (!prismModsDir.exists()) {
            throw new GradleException("Prism mods folder does not exist: ${prismModsDir}")
        }
        def stalePattern = ~/^${java.util.regex.Pattern.quote(deployModId)}-.*\.jar$/
        prismModsDir.listFiles()?.findAll {
            it.isFile() && stalePattern.matcher(it.name).matches()
        }?.each {
            logger.lifecycle("deployToPrism: removing stale ${it.name}")
            it.delete()
        }
    }

    from tasks.named('jar').flatMap { it.archiveFile }
    into prismModsDir

    doLast {
        logger.lifecycle("deployToPrism: copied ${deployModId}-${deployModVersion}.jar -> ${prismModsDir}")
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
